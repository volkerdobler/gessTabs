name: CI

on:
    push:
        branches: [master, develop]
        tags: ['v*']
    pull_request:
        branches: [master, develop]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            # keytar (transitive dependency of @vscode/vsce) may fall back to a
            # native build if no prebuild matches the runner.
            - name: Install libsecret
              run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

            - run: npm ci

            - name: Type-check
              run: npm run pretest

            - name: Lint
              run: npm run lint

            - name: Unit tests
              run: npm test

            - name: Compile
              run: npm run compile

            - name: Package VSIX
              run: npx vsce package

            - uses: actions/upload-artifact@v4
              with:
                  name: gesstabs-vsix
                  path: '*.vsix'
                  if-no-files-found: error

    publish:
        needs: [build]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
            - run: npm ci
            - name: Package VSIX
              run: npx vsce package -o gesstabs.vsix

            - name: Publish to VS Code Marketplace
              run: npx vsce publish --pat "$VSCE_PAT" --packagePath gesstabs.vsix
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
